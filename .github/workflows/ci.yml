name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Type check, test, Rust tests
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The tests run the TypeScript sources directly, which needs Node 22.18 or newer.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ci-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ci-cargo-

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      # The app bundles target/release/winotch-hook.exe, and the MCP tests run it.
      # One command per step: PowerShell carries on after a failed command in the same step.
      - name: Build the relay
        run: cargo build --release -p winotch-hook --locked

      - name: Island and MCP tests
        run: npm test

      - name: Rust tests
        run: cargo test --workspace --locked
